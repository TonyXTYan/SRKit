# Publishes the Relativistic Navigator with GitHub Pages: the committed single-file page becomes the site's index.
# One-time setting: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'navigator/relativistic-navigator.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as GitHub's own Pages workflows have: a deployment in the same job as the upload can ask for the
  # artifact before it is listed, and fails with "No artifacts named github-pages were found".
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir site
          cp navigator/relativistic-navigator.html site/index.html
          cp LICENSE navigator/STAR-DATA.md site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
